[project]
name = "nazariya"
version = "0.1.2"
description = "A local visual search and clustering tool for image archives."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Suhail" }
]
dependencies = [
  "typer>=0.12.0",
  "rich>=13.0.0",
  "rawpy>=0.27.0",
  "numpy>=2.4.4",
  "opencv-python>=4.13.0.92",
  "pillow>=12.2.0",
  "torch>=2.12.0",
  "torchvision>=0.27.0",
  "open-clip-torch>=3.3.0",
]

[project.urls]
Repository = "https://github.com/clariform/nazariya"

[project.scripts]
nazariya = "nazariya.cli:app"

[build-system]
requires = ["uv_build>=0.10.0,<0.12.0"]
build-backend = "uv_build"
